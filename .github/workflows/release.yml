name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version number
  push:
    tags:
      - 'v*'
    paths:
      - 'crates/**'
      - 'data/generated/**'
      - 'docker/Dockerfile.ci'
      - 'java_wrapper/**'
      - 'pico_libraries/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: pico_limbo
  LIB_NAME: pico_limbo_lib
  ZIG_VERSION: 0.14.1
  CARGO_ZIGBUILD_VERSION: 0.23.0
  GLIBC_VERSION: '2.28'

jobs:
  build-linux-musl:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools

      - name: Install toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} artifacts/
          cd artifacts && tar -czf ../${{ env.BINARY_NAME }}_${{ matrix.name }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}_${{ matrix.name }}
          path: ${{ env.BINARY_NAME }}_${{ matrix.name }}.tar.gz

  build-linux-gnu:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64-gnu
            runner: ubuntu-latest
            zig-arch: x86_64
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
            zig-arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig-arch }}-linux-${ZIG_VERSION}.tar.xz"
          tar -xf "zig-${{ matrix.zig-arch }}-linux-${ZIG_VERSION}.tar.xz"
          echo "$PWD/zig-${{ matrix.zig-arch }}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-zigbuild-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-zigbuild-${{ matrix.target }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-zigbuild-

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Build
        run: cargo zigbuild --release --lib --bin ${{ env.BINARY_NAME }} --target "${{ matrix.target }}.${GLIBC_VERSION}"

      - name: Upload Library for Java
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lib${{ env.LIB_NAME }}.so

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} artifacts/
          cd artifacts && tar -czf ../${{ env.BINARY_NAME }}_${{ matrix.name }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}_${{ matrix.name }}
          path: ${{ env.BINARY_NAME }}_${{ matrix.name }}.tar.gz

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup target add aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-apple-darwin-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --bin ${{ env.BINARY_NAME }} --lib

      - name: Upload Library for Java
        uses: actions/upload-artifact@v4
        with:
          name: lib-macos-aarch64
          path: target/aarch64-apple-darwin/release/lib${{ env.LIB_NAME }}.dylib

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }} artifacts/
          cd artifacts && tar -czf ../${{ env.BINARY_NAME }}_macos-aarch64.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}_macos-aarch64
          path: ${{ env.BINARY_NAME }}_macos-aarch64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86_64-pc-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-pc-windows-msvc-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --bin ${{ env.BINARY_NAME }} --lib

      - name: Upload Library for Java
        uses: actions/upload-artifact@v4
        with:
          name: lib-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/${{ env.LIB_NAME }}.dll

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          Copy-Item "target/x86_64-pc-windows-msvc/release/${{ env.BINARY_NAME }}.exe" artifacts/
          Compress-Archive -Path artifacts/* -DestinationPath "${{ env.BINARY_NAME }}_windows-x86_64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}_windows-x86_64
          path: ${{ env.BINARY_NAME }}_windows-x86_64.zip

  build-publish-java:
    runs-on: ubuntu-latest
    needs:
      - build-linux-gnu
      - build-macos
      - build-windows
    # 자바 래퍼 빌드가 실패해도 괜찮다면 다른 작업에 영향이 없도록 합니다.
    continue-on-error: true

    defaults:
      run:
        working-directory: java_wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Download Linux x86_64 Lib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lib-linux-x86_64-gnu
          path: java_wrapper/wrapper/src/main/resources/linux/x86_64

      - name: Download Linux Aarch64 Lib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lib-linux-aarch64-gnu
          path: java_wrapper/wrapper/src/main/resources/linux/aarch64

      - name: Download MacOS Aarch64 Lib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lib-macos-aarch64
          path: java_wrapper/wrapper/src/main/resources/macos/aarch64

      - name: Download Windows x86_64 Lib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lib-windows-x86_64
          path: java_wrapper/wrapper/src/main/resources/windows/x86_64

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish Java Wrapper to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :wrapper:modrinth -x :wrapper:jar

      - name: Rename and Prepare Artifact
        run: |
          mv wrapper/build/libs/pico_limbo_java_wrapper.jar ../${{ env.BINARY_NAME }}_java_wrapper.jar

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}_java_wrapper
          path: ${{ env.BINARY_NAME }}_java_wrapper.jar

  release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    # 🔥 핵심 변경 부분: 일부 빌드가 실패해도 무조건 실행되게 합니다.
    if: always()

    needs:
      - build-linux-musl
      - build-linux-gnu
      - build-macos
      - build-windows
      - build-publish-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version }}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          
          # 태그 이름이 없으면 임시 이름 생성 방어 코드
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "main" ]; then
            TAG_NAME="v0.0.0-auto"
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        # 🔥 다운로드할 파일이 1개라도 없어도 중단되지 않게 막아줍니다.
        continue-on-error: true
        with:
          path: ./artifacts
          pattern: ${{ env.BINARY_NAME }}_*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          files: ./artifacts/*
